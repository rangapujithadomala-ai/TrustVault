
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrustVault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">

        <!-- Left Branding Section -->
        <section class="brand-section">
            <div class="brand-content">
                <div class="brand-logo">TrustVault</div>

                <h1>Your documents.<br>Your control.</h1>

                <p>
                    Securely manage and share your documents.
                    You decide who can access them and what
                    they are allowed to do.
                </p>
            </div>

            <div class="brand-footer">
                Secure document sharing made simple.
            </div>
        </section>

        <!-- Right Login Section -->
        <section class="form-section">
            <div class="form-container">

                <div class="form-heading">
                    <h2>Welcome back</h2>
                    <p>Sign in to continue to your account.</p>
                </div>

                <form id="loginForm" novalidate>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                        >
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password"
                            >
                                <svg class="eye-icon" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor"
                                     stroke-width="1.8">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me and Forgot Password -->
                    <div class="login-options">
                        <label class="remember-option">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>

                        <a href="forgot-password.html"
                           class="forgot-link">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Message -->
                    <div
                        id="message"
                        class="message"
                        role="status"
                        aria-live="polite">
                    </div>

                    <!-- Login Button -->
                    <button
                        type="submit"
                        id="submitButton"
                        class="submit-button">
                        Sign In
                    </button>

                </form>

                <p class="form-footer">
                    Don't have an account?
                    <a href="register.html">Create an account</a>
                </p>

            </div>
        </section>

    </main>

    <script src="login.js"></script>
</body>
</html>
