
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | TrustVault</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body data-status="{{ verification_status or '' }}">

    <div class="auth-container">
        <div class="auth-card">

            <div class="logo">
                <h1>TrustVault</h1>
                <p>Secure Document Sharing</p>
            </div>

            <div class="verification-icon">
                ✓
            </div>

            <h2>Email Verification</h2>

            <p class="verification-message">
                Your email verification status will appear here.
            </p>

            <div id="verification-status">
                <p>
                    Please wait while we verify your email address.
                </p>
            </div>

            <a href="/login.html" class="auth-button">
                Go to Login
            </a>

        </div>
    </div>
<script src="/email-verification.js"></script>
<script src="/settings.js"></script>
</body>
</html>
